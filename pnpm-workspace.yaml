packages:
  - packages/*

overrides:
  "@daybrush/utils": "^1.13.0"
  "@types/react": "^16.9.17"
  "typescript": "^4.8 <4.9"
  "@storybook/react": "^6.4.22"
  "@storybook/addon-actions": "^6.4.22"
  "@storybook/addon-controls": "^6.4.22"
  "@storybook/addon-docs": "^6.4.22"
  "@storybook/addon-links": "^6.4.22"
  "@storybook/addon-viewport": "^6.4.22"
  "@storybook/addons": "^6.4.22"
  "@egjs/agent": "^2.2.1"
  "@egjs/children-differ": "^1.0.1"
  "@egjs/list-differ": "^1.0.0"
  "@scena/dragscroll": "^1.4.0"
  "@scena/matrix": "^1.1.1"
  "css-to-mat": "^1.1.1"
  "framework-utils": "^1.1.0"
  "gesto": "^1.19.3"
  "overlap-area": "^1.1.0"
  "croact-css-styled": "^1.1.9"
  "react-css-styled": "^1.1.9"
  "tslib": "^2.3.1"
  # @storybook/jest@0.0.10 depends on the `storybook-jest` dist-tag; pin it to the version yarn.lock resolved
  "@storybook/jest>@storybook/expect": "27.5.2-0"

# Only esbuild needs its install script (prepares the platform binary used by vite).
# The rest only print banners, compile an optional fsevents@1, download Playwright browsers
# (installed explicitly with `playwright install` instead) or run `svelte-kit sync`
# (already part of svelte-moveable's `package` script).
allowBuilds:
  esbuild: true
  "@sveltejs/kit": false
  core-js: false
  core-js-pure: false
  fsevents: false
  playwright: false
  preact: false
  svelte-preprocess: false
