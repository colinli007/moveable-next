packages:
  - packages/*

overrides:
  "@daybrush/utils": "^1.13.0"
  "@types/react": "^16.9.17"
  "@egjs/agent": "^2.2.1"
  "@egjs/children-differ": "^1.0.1"
  "@egjs/list-differ": "^1.0.0"
  "@scena/dragscroll": "^1.4.0"
  "@scena/matrix": "^1.1.1"
  "css-to-mat": "^1.1.1"
  "framework-utils": "^1.1.0"
  "gesto": "^1.19.3"
  "overlap-area": "^1.1.0"
  "croact-css-styled": "^1.1.9"
  "react-css-styled": "^1.1.9"
  "tslib": "^2.3.1"
  # react-keycon pulls @cfcs/react (core ~0.0.6, resolves to 0.0.26) and keycon (core ^0.0.6 = 0.0.6).
  # Two copies of @cfcs/core break useKeycon's result type; 0.0.6 is within both ranges.
  "@cfcs/react>@cfcs/core": "0.0.6"

packageExtensions:
  # preact-css-styled imports preact/compat but does not declare preact; under the
  # isolated layout it cannot resolve preact. Remove once fixed upstream.
  preact-css-styled:
    peerDependencies:
      preact: "*"

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-react 7.37.5 runs on ESLint 10 but its peer range stops at ^9.7.
    # Remove once a release declares ESLint 10.
    eslint-plugin-react>eslint: "10"

# Only esbuild needs its install script (prepares the platform binary used by vite).
# The rest only print banners, compile an optional fsevents@1 or download Playwright browsers
# (installed explicitly with `playwright install` instead).
allowBuilds:
  esbuild: true
  core-js: false
  fsevents: false
  playwright: false
  preact: false
