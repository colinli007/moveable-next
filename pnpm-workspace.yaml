packages:
  - packages/*

# Third-party dependencies declared by two or more packages; those packages use `catalog:`.
# Dependencies used by a single package keep their range in that package.json.
# `pnpm lint` fails when a dependency listed in several packages is not on the catalog.
catalog:
  # Tooling
  "@types/react": ^19.3.0
  playwright: ^1.64.1
  tsdown: ~0.23.1
  typescript: ~6.0.3
  # Must be the same exact version. `pnpm update -r` leaves exact versions alone: bump both by hand.
  vitest: 5.0.4
  "@vitest/browser-playwright": 5.0.4
  # Runtime dependencies
  "@daybrush/utils": ^1.13.0
  "@egjs/agent": ^2.4.4
  "@egjs/children-differ": ^1.0.1
  "@egjs/list-differ": ^1.0.1
  "@scena/dragscroll": ^1.4.0
  "@scena/event-emitter": ^1.0.5
  "@scena/matrix": ^1.1.1
  croact: ^1.0.4
  css-to-mat: ^1.1.1
  framework-utils: ^1.1.0
  gesto: ^1.19.4
  overlap-area: ^1.1.0
  # Framework (vue3-moveable's dev version of its peer; the Vue examples in react-moveable's Storybook)
  vue: ^3.5.44

overrides:
  # react-keycon pulls @cfcs/react (core ~0.0.6, resolves to 0.0.26) and keycon (core ^0.0.6 = 0.0.6).
  # Two copies of @cfcs/core break useKeycon's result type (typecheck:stories fails); 0.0.6 is within
  # both ranges. Remove once react-keycon's dependencies agree on one @cfcs/core.
  "@cfcs/react>@cfcs/core": "0.0.6"

packageExtensions:
  # vue3-selecto 1.12.3 and vue3-infinite-viewer 0.17.1 import `vue` and `@daybrush/utils` without declaring them
  # (Vite fails with `Failed to resolve import "@daybrush/utils"` under the isolated layout). Used by the Vue examples
  # in react-moveable's Storybook. Remove once releases declare both.
  vue3-selecto:
    dependencies:
      "@daybrush/utils": ^1.13.0
    peerDependencies:
      vue: ^3.0.0
  vue3-infinite-viewer:
    dependencies:
      "@daybrush/utils": ^1.13.0
    peerDependencies:
      vue: ^3.0.0

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-react 7.37.5 runs on ESLint 10 but its peer range stops at ^9.7.
    # Remove once a release declares ESLint 10.
    eslint-plugin-react>eslint: "10"

# Only esbuild has an install script (prepares the platform binary used by vite).
allowBuilds:
  esbuild: true
