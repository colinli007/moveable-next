name: Storybook Tests
on: [push, pull_request]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from the root package.json `packageManager` field
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm --filter react-moveable exec playwright install chromium
      - name: Run Storybook tests
        run: pnpm --filter react-moveable test:ci
      - name: Run Original Storybook
        if: ${{ failure() }}
        run: pnpm --filter react-moveable test:fail-ci
      - name: Archive Failed Artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: failed snapshot
          path: packages/react-moveable/__snapshots__
