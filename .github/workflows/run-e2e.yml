name: Tests
on: [push, pull_request]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from the root package.json `packageManager` field
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Lints the src of the seven library packages and svelte-moveable (root eslint.config.mjs); needs no build output
      - name: Lint
        run: pnpm lint
      # Builds every publishable package in dependency order (pnpm -r build)
      - name: Build packages
        run: pnpm packages:build
      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm --filter react-moveable exec playwright install chromium
      - name: Type-check stories
        run: pnpm --filter react-moveable typecheck:stories
      # Story tests of react-moveable, unit tests of every package and browser tests of the
      # framework wrappers against their dist (root vitest.config.mts)
      - name: Run tests
        run: pnpm test
      - name: Archive failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: failure screenshots
          path: .vitest/attachments/failure-screenshots
