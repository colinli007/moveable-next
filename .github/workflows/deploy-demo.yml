name: Deploy demo
# Manual only: the API docs and UMD builds on the site should match a release, so a person
# decides when to publish. Run it from the Actions tab once Pages is set to "GitHub Actions".
on:
  workflow_dispatch:
# A running deployment is never cancelled; a later run waits for it.
concurrency:
  group: pages
  cancel-in-progress: false
# Permissions are granted per job: building only reads the repository, deploying only needs Pages.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from the root package.json `packageManager` field
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Builds every package, the API docs and Storybook, then copies them into ./demo (the site root)
      - name: Build demo site
        run: pnpm demo:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
